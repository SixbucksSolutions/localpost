version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - bodyclose
    - errorlint
    - gocritic
    - revive
    - unconvert
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      disable-default-exclusions: true
    revive:
      enable-default-rules: true
  exclusions:
    presets: []

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
