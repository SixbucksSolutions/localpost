name: Certify native Linux platforms

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native architecture wave
        required: true
        type: choice
        options:
          - amd64
          - arm64
        default: amd64

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Select only the requested wave
        id: matrix
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          case "$ARCHITECTURE" in
            amd64) echo 'matrix={"include":[{"runner":"ubuntu-24.04","platform":"ubuntu-24.04","architecture":"amd64"},{"runner":"ubuntu-26.04","platform":"alpine-3.24","architecture":"amd64"}]}' >> "$GITHUB_OUTPUT" ;;
            arm64) echo 'matrix={"include":[{"runner":"ubuntu-24.04-arm","platform":"ubuntu-24.04","architecture":"arm64"},{"runner":"ubuntu-26.04-arm","platform":"ubuntu-26.04","architecture":"arm64"},{"runner":"ubuntu-26.04-arm","platform":"alpine-3.24","architecture":"arm64"}]}' >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
  candidate:
    if: inputs.architecture == 'arm64'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Build unpublished ARM64 candidate from original release source twice
        run: |
          test "$(uname -m)" = aarch64
          test "$(git rev-parse 'v0.1.0^{commit}')" = 852b8a9ded0d03e98cada5810b18c92746848545
          go test ./tools/release
          go run ./tools/release --version 0.1.0 --source-ref v0.1.0 --targets linux/arm64 --output "$RUNNER_TEMP/candidate"
          go run ./tools/release --version 0.1.0 --source-ref v0.1.0 --targets linux/arm64 --output "$RUNNER_TEMP/repeat"
          diff -u "$RUNNER_TEMP/candidate/SHA256SUMS" "$RUNNER_TEMP/repeat/SHA256SUMS"
          (cd "$RUNNER_TEMP/candidate" && sha256sum --check SHA256SUMS)
          {
            printf 'status=unpublished-test-candidate\nsource=852b8a9ded0d03e98cada5810b18c92746848545\n'
            printf 'builder=%s\n' "$GITHUB_SHA"
            uname -srmo
            go version
          } > "$RUNNER_TEMP/candidate/provenance.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpublished-arm64-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
  certify:
    needs: [prepare, candidate]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.candidate.result == 'success' || needs.candidate.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Download published AMD64 bytes without authentication
        if: matrix.architecture == 'amd64'
        run: |
          mkdir "$RUNNER_TEMP/candidate"
          for asset in localpost_0.1.0_linux_amd64.tar.gz SHA256SUMS; do
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 60 "https://github.com/SixbucksSolutions/localpost/releases/download/v0.1.0/$asset" -o "$RUNNER_TEMP/candidate/$asset"
          done
      - name: Retrieve retained ARM64 candidate
        if: matrix.architecture == 'arm64'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unpublished-arm64-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Verify archive identity and unpack
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const root=path.join(process.env.RUNNER_TEMP,'candidate');
          const name=`localpost_0.1.0_linux_${process.env.ARCHITECTURE}.tar.gz`;
          const hash=createHash('sha256').update(fs.readFileSync(path.join(root,name))).digest('hex');
          const sums=fs.readFileSync(path.join(root,'SHA256SUMS'),'utf8');
          assert.ok(sums.split('\n').includes(`${hash}  ${name}`));
          if(process.env.ARCHITECTURE==='amd64') {
            const accepted=JSON.parse(fs.readFileSync('release/0.1.0-candidate.json'));
            assert.equal(hash,accepted.assets.find(a=>a.name===name).sha256);
            assert.equal(createHash('sha256').update(sums).digest('hex'),accepted.checksumFile.sha256);
          }
          JS
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP/candidate/localpost_0.1.0_linux_$ARCHITECTURE.tar.gz" -C "$RUNNER_TEMP/unpacked"
          git diff --exit-code 852b8a9ded0d03e98cada5810b18c92746848545 -- cmd/localpost go.mod .go-version
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise native packaged service and filesystem
        env:
          CERTIFY_ARCHITECTURE: ${{ matrix.architecture }}
          CERTIFY_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/run-platform-certification.sh
      - name: Retain platform evidence and candidate identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: certification-${{ matrix.platform }}-${{ matrix.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/certification/*
            ${{ runner.temp }}/candidate/SHA256SUMS
            ${{ runner.temp }}/candidate/provenance.txt
          if-no-files-found: error
          retention-days: 90
