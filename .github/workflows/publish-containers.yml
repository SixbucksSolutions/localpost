name: Publish qualified containers

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish qualified v0.2.0 containers and promote latest
        required: true
        type: boolean
        default: false
      qualified_run_id:
        description: Publish retained images from the accepted qualification-only run
        required: false
        type: string
        default: ''
      promote_run_id:
        description: Resume only a failed promotion from this exact workflow revision
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-localpost-0.2.0
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sixbuckssolutions/localpost
  PUBLISH_CONTAINERS: ${{ inputs.publish }}
  QUALIFIED_RUN_ID: ${{ inputs.qualified_run_id }}
  PROMOTE_RUN_ID: ${{ inputs.promote_run_id }}
  GH_TOKEN: ${{ github.token }}

jobs:
  qualify:
    if: ${{ !inputs.publish || (inputs.promote_run_id == '' && inputs.qualified_run_id == '') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            architecture: amd64
          - runner: ubuntu-26.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      CONTAINER_IMAGE: localpost-qualified:${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Verify candidate archive and native host
        run: |
          node scripts/container-package.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          node --test scripts/publish-containers.test.mjs
      - name: Package existing release bytes
        run: |
          source_epoch=$(git show -s --format=%ct "$SOURCE_COMMIT")
          docker buildx build --load --provenance=false --sbom=false \
            --platform "linux/$ARCHITECTURE" \
            --build-arg "SOURCE_DATE_EPOCH=$source_epoch" \
            --build-arg "SOURCE_REVISION=$SOURCE_COMMIT" \
            --build-arg "PACKAGING_REVISION=$GITHUB_SHA" \
            --file Dockerfile --tag "$CONTAINER_IMAGE" \
            "$RUNNER_TEMP/unpacked/localpost_0.2.0_linux_$ARCHITECTURE"
      - name: Qualify exact native image
        run: node scripts/qualify-container.mjs
      - name: Save exact tested image
        run: |
          mkdir -p "$RUNNER_TEMP/qualified/$ARCHITECTURE"
          docker save --output "$RUNNER_TEMP/qualified/$ARCHITECTURE/image.tar" "$CONTAINER_IMAGE"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const [image]=JSON.parse(execFileSync('docker',['image','inspect',process.env.CONTAINER_IMAGE]));
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/qualified/${process.env.ARCHITECTURE}/identity.json`, JSON.stringify({architecture:process.env.ARCHITECTURE,imageId:image.Id},null,2));
          JS
      - name: Retain tested image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualified-${{ matrix.architecture }}
          path: ${{ runner.temp }}/qualified/${{ matrix.architecture }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: true
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-qualification-${{ matrix.architecture }}
          path: ${{ runner.temp }}/container-evidence/*
          if-no-files-found: warn
          retention-days: 90
          overwrite: true

  publish:
    if: always() && inputs.publish && inputs.promote_run_id == '' && ((inputs.qualified_run_id == '' && needs.qualify.result == 'success') || (inputs.qualified_run_id != '' && needs.qualify.result == 'skipped'))
    needs: qualify
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      # Reuse accepted image archives without rebuilding after candidate acceptance.
      - name: Validate accepted qualification source
        if: inputs.qualified_run_id != ''
        run: node scripts/publish-containers.mjs qualified-check
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualified_run_id || github.run_id }}
          name: qualified-amd64
          path: ${{ runner.temp }}/qualified/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualified_run_id || github.run_id }}
          name: qualified-arm64
          path: ${{ runner.temp }}/qualified/arm64
      - name: Authenticate package publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish exact tested platforms and guarded version index
        run: node scripts/publish-containers.mjs publish
      - name: Record version publication
        run: |
          echo 'Version 0.2.0 is published to the public localpost GHCR package; anonymous verification follows.' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/container-publication/publication.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-publication
          path: ${{ runner.temp }}/container-publication/publication.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Clear registry credentials
        if: always()
        run: docker logout ghcr.io

  anonymous:
    if: inputs.publish && inputs.promote_run_id == ''
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            architecture: amd64
          - runner: ubuntu-26.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-publication
          path: ${{ runner.temp }}/container-publication
      - name: Prepare anonymous verification and accepted package
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          mkdir -m 700 "$DOCKER_CONFIG"
          node scripts/container-package.mjs
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify anonymous native pull with bounded visibility retry
        timeout-minutes: 10
        run: |
          deadline=$((SECONDS + 600))
          until node scripts/publish-containers.mjs verify; do
            if (( SECONDS >= deadline )); then exit 1; fi
            sleep 15
          done
      - name: Qualify anonymously pulled version image
        run: node scripts/qualify-container.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anonymous-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/container-publication/anonymous-${{ matrix.architecture }}.json
            ${{ runner.temp }}/container-evidence/qualification.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Retain anonymous failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anonymous-failure-${{ matrix.architecture }}
          path: ${{ runner.temp }}/container-evidence/*
          if-no-files-found: warn
          retention-days: 90
          overwrite: true

  promote:
    needs: [publish, anonymous]
    if: always() && inputs.publish && (inputs.promote_run_id != '' || (needs.publish.result == 'success' && needs.anonymous.result == 'success'))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Select and validate promotion source
        id: source
        env:
          PROMOTE_RUN_ID: ${{ inputs.promote_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$PROMOTE_RUN_ID" ]; then
            node scripts/publish-containers.mjs resume-check
            source_run="$PROMOTE_RUN_ID"
          else
            source_run="$GITHUB_RUN_ID"
          fi
          echo "run_id=$source_run" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: container-publication
          path: ${{ runner.temp }}/container-publication
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: anonymous-amd64
          path: ${{ runner.temp }}/promotion-artifacts/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: anonymous-arm64
          path: ${{ runner.temp }}/promotion-artifacts/arm64
      - name: Normalize and verify anonymous qualification receipts
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {copyFile,readFile} from 'node:fs/promises';
          import path from 'node:path';
          for (const architecture of ['amd64','arm64']) {
            const source=path.join(process.env.RUNNER_TEMP,'promotion-artifacts',architecture);
            const receiptPath=path.join(source,'container-publication',`anonymous-${architecture}.json`);
            const receipt=JSON.parse(await readFile(receiptPath));
            const qualification=JSON.parse(await readFile(path.join(source,'container-evidence','qualification.json')));
            assert.equal(qualification.passed,true);
            assert.equal(qualification.architecture,architecture);
            assert.equal(qualification.imageId,receipt.imageId);
            await copyFile(receiptPath,path.join(process.env.RUNNER_TEMP,'container-publication',`anonymous-${architecture}.json`));
          }
          JS
      - name: Authenticate package publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Promote verified version index to latest
        run: node scripts/publish-containers.mjs promote
      - name: Clear registry credentials
        if: always()
        run: docker logout ghcr.io
