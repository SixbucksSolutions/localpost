name: Go race verification

on:
  push:
    paths:
      - '**/*.go'
      - go.mod
      - .go-version
      - .node-version
      - 'examples/**'
      - scripts/check.ps1
      - 'scripts/**'
      - openapi.json
      - package.json
      - package-lock.json
      - .github/workflows/race.yml
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - .go-version
      - .node-version
      - 'examples/**'
      - scripts/check.ps1
      - 'scripts/**'
      - openapi.json
      - package.json
      - package-lock.json
      - .github/workflows/race.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: race-${{ github.ref }}
  cancel-in-progress: true

jobs:
  race:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Verify race toolchain
        run: |
          go version
          gcc --version
          test "$(go env CGO_ENABLED)" = "1"
      - name: Set up pilot test runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Check browser pilot
        run: |
          node --check examples/browser-diagnostics/pilot.mjs
          node --check examples/browser-diagnostics/browser-check.mjs
          node --test examples/browser-diagnostics/pilot.test.mjs
      - name: Validate OpenAPI contract
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/validate-openapi.mjs
          node --test scripts/validate-openapi.test.mjs scripts/check-openapi-service.test.mjs scripts/qualify-packaged-service.test.mjs scripts/publish-containers.test.mjs
      - name: Check live service contract
        run: |
          go build -o "$RUNNER_TEMP/localpost-contract" ./cmd/localpost
          mailbox_root=$(mktemp -d "$RUNNER_TEMP/localpost-contract-mailboxes.XXXXXX")
          "$RUNNER_TEMP/localpost-contract" --port 53149 --mailbox-root "$mailbox_root" >"$RUNNER_TEMP/localpost-contract.log" 2>&1 &
          service_pid=$!
          trap 'kill -INT "$service_pid" 2>/dev/null || true; wait "$service_pid" 2>/dev/null || true; rm -rf -- "$mailbox_root"' EXIT
          service_ready=0
          for _ in {1..30}; do
            if ! kill -0 "$service_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/localpost-contract.log"
              echo 'Contract-test daemon exited before readiness.' >&2
              exit 1
            fi
            if grep -q 'localpost listening on http://127.0.0.1:53149' "$RUNNER_TEMP/localpost-contract.log" &&
               curl --silent --output /dev/null --connect-timeout 1 http://127.0.0.1:53149/; then
              service_ready=1
              break
            fi
            sleep 0.1
          done
          if test "$service_ready" != 1; then
            cat "$RUNNER_TEMP/localpost-contract.log"
            echo 'Contract-test daemon did not become ready.' >&2
            exit 1
          fi
          kill -0 "$service_pid"
          node scripts/check-openapi-service.mjs http://127.0.0.1:53149 "$mailbox_root"
      - name: Run race-instrumented tests
        run: go test -race -count=3 -timeout=5m ./...
      - name: Vet source
        run: go vet ./...
