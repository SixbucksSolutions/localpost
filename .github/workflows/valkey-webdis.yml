name: Valkey Webdis runtime qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'deploy/valkey-webdis/**'
      - 'cmd/localpost-client/**'
      - 'scripts/qualify-adoption*'
      - 'scripts/qualify-client-process.mjs'
      - 'scripts/build-adoption-candidate*'
      - '.github/workflows/valkey-webdis.yml'
      - '.go-version'
      - '.node-version'
      - 'go.mod'
      - 'go.sum'
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Test client on native Windows
        shell: pwsh
        env:
          GOTOOLCHAIN: go1.27.3
        run: |
          go test ./cmd/localpost-client
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows client tests failed.' }
      - name: Build reproducible candidate bundle
        shell: pwsh
        run: ./scripts/build-adoption-candidate.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'adoption-candidate')
      - name: Qualify packaged Windows process stdio
        shell: pwsh
        run: |
          node --check scripts/qualify-client-process.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Process proof syntax check failed.' }
          $binary = Join-Path $env:RUNNER_TEMP 'adoption-candidate/bin/windows-amd64/localpost-client.exe'
          $proof = Join-Path $env:RUNNER_TEMP 'windows-client-process.json'
          node scripts/qualify-client-process.mjs $binary $proof
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows process proof failed.' }
      - name: Retain native Windows process proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: localpost-adoption-windows-process-${{ github.sha }}
          path: ${{ runner.temp }}/windows-client-process.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain exact candidate bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: localpost-adoption-r1-${{ github.sha }}
          path: ${{ runner.temp }}/adoption-candidate/
          if-no-files-found: error
          retention-days: 30
  runtime:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Download exact candidate bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: localpost-adoption-r1-${{ github.sha }}
          path: ${{ runner.temp }}/adoption-candidate
      - name: Check adoption harness
        run: |
          node --check scripts/qualify-adoption.mjs
          node --check deploy/valkey-webdis/qualify.mjs
          node --test scripts/qualify-adoption.test.mjs
      - name: Verify candidate and select native binary
        env:
          GOTOOLCHAIN: go1.27.3
        run: |
          (cd "$RUNNER_TEMP/adoption-candidate" && sha256sum --strict -c SHA256SUMS)
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {appendFileSync, copyFileSync, mkdirSync, readFileSync} from 'node:fs';
          import path from 'node:path';
          const root = path.join(process.env.RUNNER_TEMP, 'adoption-candidate');
          const evidence = path.join(process.env.RUNNER_TEMP, 'valkey-webdis-evidence');
          const manifest = JSON.parse(readFileSync(path.join(root, 'manifest.json'), 'utf8'));
          assert.equal(manifest.sourceCommit, process.env.GITHUB_SHA);
          assert.equal(manifest.candidateVersion, 'adoption-r1');
          assert.equal(manifest.publicationStatus, 'unpublished');
          assert.equal(manifest.toolchain, 'go1.27.3');
          assert.deepEqual(manifest.binaries.map(item => item.target).sort(), ['linux/amd64', 'linux/arm64', 'windows/amd64']);
          const architecture = {x64: 'amd64', arm64: 'arm64'}[process.arch];
          assert.ok(architecture, 'Unsupported runtime architecture');
          const binary = manifest.binaries.find(item => item.target === `linux/${architecture}`);
          assert.equal(binary.path, `bin/linux-${architecture}/localpost-client`);
          const digest = bytes => createHash('sha256').update(bytes).digest('hex');
          assert.equal(digest(readFileSync(path.join(root, binary.path))), binary.sha256);
          // The existing harness uses checkout profile files. Require byte equality
          // with the packaged profile so the exact candidate configuration is tested.
          for (const file of ['compose.yaml', 'webdis.json', 'images.json']) {
            const relative = `deploy/valkey-webdis/${file}`;
            assert.equal(digest(readFileSync(path.join(root, relative))), digest(readFileSync(relative)));
          }
          mkdirSync(evidence, {recursive: true});
          copyFileSync(path.join(root, 'manifest.json'), path.join(evidence, 'candidate-manifest.json'));
          copyFileSync(path.join(root, 'SHA256SUMS'), path.join(evidence, 'candidate-SHA256SUMS'));
          appendFileSync(process.env.GITHUB_ENV, `LOCALPOST_CLIENT_BINARY=${path.join(root, binary.path)}\n`);
          NODE
      - name: Record exact native binary identity
        env:
          GOTOOLCHAIN: go1.27.3
        run: |
          chmod +x "$LOCALPOST_CLIENT_BINARY"
          "$LOCALPOST_CLIENT_BINARY" --version > "$RUNNER_TEMP/valkey-webdis-evidence/client-version.txt"
          go version -m "$LOCALPOST_CLIENT_BINARY" > "$RUNNER_TEMP/valkey-webdis-evidence/client-build.txt"
          sha256sum "$LOCALPOST_CLIENT_BINARY" > "$RUNNER_TEMP/valkey-webdis-evidence/client-sha256.txt"
      - name: Locate required amd64 browser
        if: runner.arch == 'X64'
        run: |
          browser=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$browser"
          echo "LOCALPOST_CHROME=$browser" >> "$GITHUB_ENV"
          echo 'LOCALPOST_REQUIRE_BROWSER=1' >> "$GITHUB_ENV"
      - name: Qualify isolated pinned runtime and exact candidate client
        env:
          LOCALPOST_EVIDENCE_DIR: ${{ runner.temp }}/valkey-webdis-evidence
        run: node deploy/valkey-webdis/qualify.mjs
      - name: Retain runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: valkey-webdis-runtime-${{ matrix.runner }}
          path: ${{ runner.temp }}/valkey-webdis-evidence/*
          if-no-files-found: warn
          retention-days: 30
