name: Windows service
on:
  workflow_dispatch:
    inputs:
      use_candidate:
        description: Exercise the exact Windows package in the frozen candidate manifest
        type: boolean
        default: false
  push:
    paths:
      - 'scripts/install-service.ps1'
      - 'scripts/test-windows-service.ps1'
      - 'scripts/test-windows-service-upload.mjs'
      - '.github/workflows/windows-service.yml'
      - 'docs/windows-service.md'
      - 'tools/release/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - '.go-version'
  pull_request:
    paths:
      - 'scripts/install-service.ps1'
      - 'scripts/test-windows-service.ps1'
      - 'scripts/test-windows-service-upload.mjs'
      - '.github/workflows/windows-service.yml'
      - 'docs/windows-service.md'
      - 'tools/release/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - '.go-version'
permissions:
  contents: read
  actions: read
jobs:
  service:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: inputs.use_candidate != true
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build identified development fixture
        if: inputs.use_candidate != true
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'localpost-service-package'
          New-Item -ItemType Directory -Path "$package/docs" -Force | Out-Null
          $env:CGO_ENABLED = '0'
          go build -trimpath -buildvcs=false -ldflags "-X main.releaseVersion=0.2.1 -X main.sourceCommit=$env:GITHUB_SHA" -o "$package/localpost.exe" ./cmd/localpost
          if ($LASTEXITCODE -ne 0) { throw 'Fixture build failed.' }
          @{version='0.2.1'; target='windows/amd64'; sourceCommit=$env:GITHUB_SHA; binarySHA256=(Get-FileHash "$package/localpost.exe").Hash.ToLowerInvariant()} | ConvertTo-Json | Set-Content "$package/build-info.json"
          Copy-Item docs/windows-service.md "$package/docs/windows-service.md"
          "SERVICE_PACKAGE=$package" >> $env:GITHUB_ENV
          "SERVICE_INSTALLER=$env:GITHUB_WORKSPACE/scripts/install-service.ps1" >> $env:GITHUB_ENV
      - name: Read exact candidate identity
        if: inputs.use_candidate == true
        id: candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const candidate = JSON.parse(fs.readFileSync('release/0.2.1-candidate.json'));
          assert.equal(candidate.version, '0.2.1');
          assert.equal(candidate.apiVersion, '2026-11-05');
          assert.equal(candidate.tag, 'v0.2.1');
          assert.match(candidate.sourceCommit, /^[0-9a-f]{40}$/);
          assert.ok(['candidate', 'published'].includes(candidate.publicationStatus));
          assert.equal(candidate.artifactName, `localpost-0.2.1-${candidate.sourceCommit}`);
          for (const id of [candidate.artifactId, candidate.artifactRunId]) assert.ok(Number.isSafeInteger(id) && id > 0);
          const windows = candidate.assets.filter(asset => asset.target === 'windows/amd64');
          assert.equal(windows.length, 1);
          assert.equal(windows[0].name, 'localpost_0.2.1_windows_amd64.zip');
          assert.equal(candidate.checksumFile.name, 'SHA256SUMS');
          for (const asset of [windows[0], candidate.checksumFile]) assert.match(asset.sha256, /^[0-9a-f]{64}$/);
          if (candidate.publicationStatus !== 'published') {
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/artifacts/${candidate.artifactId}`, {
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
              signal: AbortSignal.timeout(30000),
            });
            assert.equal(response.status, 200, 'Candidate artifact metadata unavailable');
            const artifact = await response.json();
            assert.equal(artifact.name, candidate.artifactName);
            assert.equal(artifact.expired, false);
            assert.equal(artifact.workflow_run.id, candidate.artifactRunId);
            assert.equal(artifact.workflow_run.head_sha, candidate.sourceCommit);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `published=${candidate.publicationStatus === 'published'}\nrun-id=${candidate.artifactRunId}\nartifact-name=${candidate.artifactName}\n`);
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { throw 'Candidate identity validation failed.' }
      - name: Download exact candidate artifact
        if: inputs.use_candidate == true && steps.candidate.outputs.published != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate.outputs.run-id }}
          name: ${{ steps.candidate.outputs.artifact-name }}
          path: ${{ runner.temp }}/candidate
      - name: Download published Windows package
        if: inputs.use_candidate == true && steps.candidate.outputs.published == 'true'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'candidate'
          New-Item -ItemType Directory -Path $destination | Out-Null
          foreach ($name in @('localpost_0.2.1_windows_amd64.zip', 'SHA256SUMS')) {
            Invoke-WebRequest "https://github.com/SixbucksSolutions/localpost/releases/download/v0.2.1/$name" -OutFile (Join-Path $destination $name) -TimeoutSec 60
          }
      - name: Verify and unpack exact Windows package
        if: inputs.use_candidate == true
        shell: pwsh
        run: |
          $candidate = Get-Content release/0.2.1-candidate.json -Raw | ConvertFrom-Json
          $download = Join-Path $env:RUNNER_TEMP 'candidate'
          $asset = @($candidate.assets | Where-Object target -eq 'windows/amd64')[0]
          foreach ($file in @($asset, $candidate.checksumFile)) {
            if ((Get-FileHash -LiteralPath (Join-Path $download $file.name) -Algorithm SHA256).Hash -ne $file.sha256) { throw "Frozen file checksum mismatch for $($file.name)" }
          }
          $sums = Get-Content -LiteralPath (Join-Path $download 'SHA256SUMS')
          if ($sums -cnotcontains "$($asset.sha256)  $($asset.name)") { throw 'Windows archive checksum is absent from frozen SHA256SUMS.' }
          $archivePath = Join-Path $download $asset.name
          $zip = [IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            foreach ($entry in $zip.Entries) {
              if (-not $entry.FullName.StartsWith('localpost_0.2.1_windows_amd64/', [StringComparison]::Ordinal) -or $entry.FullName.Contains('\') -or $entry.FullName.Split('/') -contains '..') { throw 'Unsafe Windows archive member.' }
            }
          } finally { $zip.Dispose() }
          $unpacked = Join-Path $env:RUNNER_TEMP 'exact-windows-package'
          Expand-Archive -LiteralPath $archivePath -DestinationPath $unpacked
          $package = Join-Path $unpacked 'localpost_0.2.1_windows_amd64'
          $env:SERVICE_PACKAGE = $package
          @'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { inspectPackage } from './scripts/qualify-packaged-service.mjs';
          const candidate = JSON.parse(fs.readFileSync('release/0.2.1-candidate.json'));
          const result = await inspectPackage({ packageDir: process.env.SERVICE_PACKAGE, expectedCommit: candidate.sourceCommit });
          assert.equal(result.identity.target, 'windows/amd64');
          console.log(`Verified exact Windows package for ${result.identity.sourceCommit}, including executable --version.`);
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { throw 'Packaged executable identity verification failed.' }
          $installer = Join-Path $package 'scripts/install-service.ps1'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw 'Frozen package does not contain its Windows installer.' }
          "SERVICE_PACKAGE=$package" >> $env:GITHUB_ENV
          "SERVICE_INSTALLER=$installer" >> $env:GITHUB_ENV
      - name: Exercise Windows service
        shell: pwsh
        run: ./scripts/test-windows-service.ps1 -PackageDirectory $env:SERVICE_PACKAGE -InstallerPath $env:SERVICE_INSTALLER
